version: "1.0"

profile:
  base:
    name: empty
  inspections:
    # Long Method - Number of statements
    - inspection: NonCommentSourceStatements
      enabled: true
      severity: WARNING
      options:
        m_limit: 20

    # Long Method - Cyclomatic Complexity
    - inspection: CyclomaticComplexity
      enabled: true
      severity: WARNING
      options:
        m_limit: 10
