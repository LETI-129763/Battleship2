# 113146 - Ricardo Oliveira
name: Qodana Switch Statements 113146

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  qodana-switch-113146:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Qodana Scan
        uses: JetBrains/qodana-action@v2026.2
        with:
          args: --config qodana-113146.yaml
          use-annotations: true
          post-pr-comment: true
          upload-result: true
          pr-mode: false