
# 129360 - Francisco Farinha
name: Qodana Long Parameter List 129360

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  qodana:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Qodana Scan
        uses: JetBrains/qodana-action@v2026.2
        with:
          args:
            --config qodana-129360.yaml
            --profile-path .qodana/profiles/profile-129360.yaml
          use-annotations: true
          post-pr-comment: true
          upload-result: true
          pr-mode: false
